<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabDesk</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --bad:#f85149; --ok:#3fb950; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--dim); margin:0 0 20px; }
  form { display:flex; gap:8px; } input { flex:1; padding:10px; border-radius:6px; border:1px solid #30363d; background:var(--panel); color:var(--ink); }
  button { padding:10px 16px; border:0; border-radius:6px; background:var(--acc); color:#0d1117; font-weight:600; cursor:pointer; }
  .card { background:var(--panel); border:1px solid #30363d; border-radius:8px; padding:14px; margin-top:16px; white-space:pre-wrap; }
  .meta { color:var(--dim); font-size:13px; margin-top:8px; } .meta b { color:var(--ink); font-weight:500; }
  .bad { color:var(--bad); } .ok { color:var(--ok); } a { color:var(--acc); }
  ul { padding-left:18px; margin:6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>LabDesk</h1>
  <p class="sub">Answers from the PyVISA 1.16.2 documentation only, with sources. Says so when the docs don't cover it.</p>
  <form id="f"><input id="q" placeholder="e.g. How do I set an infinite timeout?" autocomplete="off"><button>Ask</button></form>
  <div id="out"></div>
</main>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), out = document.getElementById('out');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
f.onsubmit = async e => {
  e.preventDefault();
  if (!q.value.trim()) return;
  out.innerHTML = '<div class="card">Thinking…</div>';
  try {
    const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q.value})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    const cited = new Set(d.cited);
    const src = d.sources.filter(s => cited.has(s.label)).map(s =>
      `<li>[${s.label}] ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</li>`).join('');
    const warn = d.invalid_citations.length ? `<div class="bad">Cites passages it was not given: ${d.invalid_citations.join(', ')}</div>` : '';
    out.innerHTML = `<div class="card">${esc(d.answer)}${warn}
<div class="meta">${d.refused ? '<b class="ok">Refused: outside the docs</b> · ' : ''}${d.tool_used ? '<b>Instrument tool used</b> · ' : ''}<b>${d.latency_s}s</b> · ${d.tokens.prompt}+${d.tokens.completion} tokens · $${d.cost_usd.toFixed(5)} · ${esc(d.model)}</div>
${src ? `<ul>${src}</ul>` : ''}</div>`;
  } catch (err) { out.innerHTML = `<div class="card bad">Error: ${esc(String(err.message || err))}</div>`; }
};
</script>
</body>
</html>
